<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="https://cdn.prod.website-files.com/61a515d3e9fb772a482c1d4a/659e3c284c8d2f4db21b24c4_favicon-32x32.png">
  <link rel="apple-touch-icon" href="https://cdn.prod.website-files.com/61a515d3e9fb772a482c1d4a/659e3c8294b1373cf9b0309b_favicon%20(1).ico">
  <title>Vijit Bhati: Case Studies Access</title>
  <meta name="description" content="Enter the password to view Vijit Bhati's UX case studies, or email him to request access." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#f9f9fa" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script defer src="/analytics.js"></script>
  <script defer src="/chat-widget.js"></script>
  <script defer src="/speed-insights.js"></script>
  <style>
    :root {
      --bg:          #ffffff;
      --deep:        #f9f9fa;
      --card:        #ffffff;
      --border:      rgba(0,0,0,0.2); /* Darkened for better visibility */
      --pink:        #FF2A85;
      --pink-lt:     #ff5e9f;
      --white:       #ffffff;
      --text-main:   #1a1a1a;
      --text-muted:  #5e5e5e;
      --fd:          'Rajdhani', sans-serif;
      --fm:          'Rajdhani', sans-serif;
      --fb:          'Rajdhani', sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--deep);
      color: var(--text-main);
      font-family: var(--fb);
      font-size: 18px;
      line-height: 1.6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 96px 0 48px;
    }

    /* Grain/Noise Overlay matches main site */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: 0.4;
    }

    .back-link {
      position: absolute;
      top: 40px;
      left: var(--gutter);
      font-family: var(--fm);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-decoration: none;
      z-index: 10;
      transition: color 0.2s;
    }
    
    .back-link:hover {
      color: var(--pink);
    }

    .card {
      background: var(--card);
      width: 100%;
      max-width: 420px;
      padding: 45px 40px;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 8px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.04);
      text-align: center;
      position: relative;
      z-index: 2;
      animation: fadeUp 0.6s ease forwards;
      margin: 20px;
    }

    .logo-img {
      height: 55px;
      width: auto;
      /* Dark Pink Filter */
      filter: invert(24%) sepia(85%) saturate(3195%) hue-rotate(322deg) brightness(97%) contrast(110%);
      margin-bottom: 20px;
    }

    .card h1 {
      font-family: var(--fd);
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .desc {
      font-size: 1.05rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 28px;
    }

    /* Fixed Input Box Styling */
    .card input {
      font-family: var(--fb);
      font-size: 1.05rem;
      font-weight: 600;
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 16px;
      border: 2px solid var(--border); /* Much darker border */
      border-radius: 4px;
      background: #ffffff; /* Solid white background */
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      text-align: left;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.03); /* Inner shadow for depth */
    }

    .card input::placeholder {
      color: #888888;
      font-weight: 400;
    }

    .card input:focus {
      border-color: var(--pink-ink);
      box-shadow: 0 0 0 3px rgba(255, 42, 133, 0.15);
    }

    .card button {
      font-family: var(--fb);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      width: 100%;
      padding: 14px 20px;
      min-height: 48px;
      background: var(--pink-ink);
      color: var(--white);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .card button:hover:not(:disabled) {
      background: var(--pink-press);
      transform: translateY(-1px);
    }

    .card button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .note {
      font-family: var(--fm);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 24px;
    }

    .field-label {
      display: block;
      text-align: left;
      font-family: var(--fm);
      font-size: .9rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .form-error {
      min-height: 1.6em;
      margin: -6px 0 12px;
      text-align: left;
      font-size: .95rem;
      font-weight: 600;
      color: #b00020;
    }
    .help {
      margin-top: 22px;
      font-size: .98rem;
      color: var(--text-muted);
    }
    .help a { color: var(--pink-ink); font-weight: 700; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  <link rel="stylesheet" href="/polish.css" />
</head>
<body>

  <a href="index.html" class="back-link">&#8592; Back to Portfolio</a>

  <main class="card">
    <img src="logo-vb.svg" alt="" class="logo-img" width="55" height="55" onerror="this.style.display='none'" />
    <h1>Case Studies</h1>
    <p class="desc">Enter the password to view the case studies.</p>

    <form id="login" novalidate>
      <label class="field-label" for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" aria-describedby="password-error" />
      <p class="form-error" id="password-error" role="alert" aria-live="assertive"></p>
      <button type="submit">View Case Studies</button>
    </form>

    <p class="help">Need access? <a href="mailto:vijitsinghbhati@gmail.com?subject=Case%20study%20access">Email Vijit</a></p>
  </main>

  <script>
    const form = document.getElementById('login');
    const input = document.getElementById('password');
    const error = document.getElementById('password-error');
    const submitBtn = form.querySelector('button');

    function showError(message) {
      error.textContent = message;
      input.setAttribute('aria-invalid', 'true');
      input.focus();
    }

    input.addEventListener('input', () => {
      if (error.textContent) { error.textContent = ''; input.removeAttribute('aria-invalid'); }
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = input.value.trim();
      if (!password) return showError('Enter the password to continue.');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Checking…';
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        if (response.ok) {
          const study = /^#(eyq|saas|listing|wingman)$/.test(location.hash) ? location.hash : '';
          window.location.href = '/case-studies.html' + study;
          return;
        }
        input.value = '';
        showError(response.status === 401 ? 'That password is incorrect. Try again or email Vijit for access.' : 'Something went wrong. Please try again.');
      } catch (e) {
        showError('Could not reach the server. Check your connection and try again.');
      }
      submitBtn.disabled = false;
      submitBtn.textContent = 'View Case Studies';
    });
  </script>
</body>
</html>
